system:
  uav_id: uav_01
  allow_arm: false

# Positioning readiness remains a separate safety prerequisite for mission start.
positioning:
  workspace_env: /home/orangepi/ros_ws/devel/env.sh
  launch_package: lidar_to_mavros
  launch_file: fastlio_to_px4_mid360_direct.launch
  launch_args: ["rviz:=false", "zero_origin:=true"]
  stop_timeout_s: 5.0
  startup_timeout_s: 15.0
  stable_time_s: 3.0
  message_timeout_s: 0.3
  max_xy_drift_m: 0.05
  max_z_drift_m: 0.05
  conflict_nodes: [laserMapping, lidar_to_mavros]

topics:
  mission_config: /uav_protocol/mission_config
  mission_start: /uav_protocol/mission_start
  car_event: /uav_protocol/car/event
  mission_reset: /uav_protocol/mission_reset
  positioning_status: /d_task/positioning/status
  px4_odom: /mavros/local_position/odom
  bridge_state: /ego_bridge/flight_state
  control_mode: /ego_bridge/control_mode
  image: /usb_camera_vision/usb_cam/image_raw
  camera_info: /usb_camera_vision/usb_cam/camera_info
  task_state: /uav_protocol/task_state
  local_event: /uav_protocol/local_event
  local_fault: /uav_protocol/local_fault
  local_health: /uav_protocol/local_health
  vision_health: /d_task/vision/health
  tag_center: /d_task/vision/tag0_center
  local_tracking: /uav_protocol/local_tracking
  debug: /d_task/simple_follow/debug

# Minimal tuning surface.  Height is a fixed setpoint relative to the
# positioning home; the PID only controls horizontal image-centre error.
simple_follow:
  flight_height_m: 1.50
  control_rate_hz: 30.0
  odom_timeout_s: 0.30
  tag_timeout_s: 0.20
  takeoff_retry_s: 0.50
  landing_retry_s: 0.50
  min_tag_side_px: 8.0
  tag_id: 0

  # Rectified-image target relative to the calibrated principal point.
  # Positive u is image-right; positive v is image-down.
  target_offset_u_px: 37.023901
  target_offset_v_px: 180.624102

  # After takeoff, first move 0.5 m at 1 o'clock relative to the locked
  # takeoff heading (12 o'clock is forward; clockwise is right).
  initial_offset_distance_m: 0.50
  initial_offset_clockwise_deg: 30.0
  initial_offset_reach_radius_m: 0.08

  # After the diagonal offset, search one metre along the locked takeoff
  # heading.  A real tag observation immediately hands control to follow.
  forward_search_distance_m: 1.00
  forward_search_reach_radius_m: 0.08

  # The payload gate is event-driven, not a fixed follow duration: Tag 0 must
  # remain centred at cruise height for the stable window below.
  drop_alignment_tolerance: 0.08
  drop_alignment_stable_s: 1.00
  height_tolerance_m: 0.10

  # After the GPIO pulse returns neutral, hold briefly before signalling the
  # car to speed up and returning directly to the positioning home.
  release_settle_s: 0.25
  home_xy_tolerance_m: 0.20
  home_stable_s: 0.50

  pid:
    kp: 0.65
    ki: 0.00
    kd: 0.00
    deadband: 0.04
    integral_limit: 0.50
    max_speed_mps: 0.35

# Orange Pi 5 Ultra physical pin 16 (GPIO1_A3, WiringOP 9) drives the
# delivery actuator.  The output is reset to neutral on every configuration,
# abort, shutdown, and after the single release pulse.
payload:
  enabled: true
  backend: gpio
  gpio_wiringpi_pin: 9
  gpio_active_high: true
  topic: /mavros/actuator_control
  group_mix: 2
  channel: 0
  release_value: 1.0
  neutral_value: 0.0
  pulse_duration_s: 5.0
